[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strategy-engine"
version = "0.1.0"
description = "AlpacaRelay Systematic Long-Term Holding & Rebalancing Strategy Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AlpacaRelay Quantitative Team" }
]
dependencies = [
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "jinja2>=3.1.3",
    "uvicorn>=0.28.0",
]

[project.scripts]
strategy-engine = "strategy_engine.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
